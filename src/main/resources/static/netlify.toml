# Netlify Configuration File for Simpatico Liquidations Static Website

[build]
  publish = "."

# Production Reverse Proxy Redirect forwarding API calls to the Spring Boot Production API
[[redirects]]
  from = "/api/*"
  to = "https://api.simpaticoliquidations.com/api/:splat"
  status = 200
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
